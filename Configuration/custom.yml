---
title: Custom
privilege: trustedInstaller
actions:

 - !powerShell: {command: '.\suitability.ps1', exeDir: true, wait: true, oobe: false}

 - !cmd: {command: 'reg import RunAsTI.reg', exeDir: true, wait: true, runas: currentUserElevated}

 - !writeStatus {status: "Copying Files"}
 - !cmd: {exeDir: true, command: 'xcopy "Windows" "%windir%" /E /I /Y', wait: true}
 - !cmd: {exeDir: true, command: 'xcopy "SOS" "%systemdrive%\SOS" /E /I /Y', wait: true}
 - !cmd: {exeDir: true, command: 'robocopy "User Account Pictures" "%ProgramData%\Microsoft\User Account Pictures"'}

 - !powerShell:
      command: 'Copy-Item -Path ".\SOS.lnk" -Destination "$env:PUBLIC\Desktop\SOS.lnk" -Force'
      exeDir: true
      wait: true

 - !registryValue:
    path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Notifications\Settings\Windows.SystemToast.SecurityAndMaintenance'
    value: 'Enabled'
    type: REG_DWORD
    data: '0'


  # OEM Information
 - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\OEMInformation', value: 'Model', type: REG_SZ, data: 'SYNERGYOS', iso: true}
 - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\OEMInformation', value: 'Manufacturer', type: REG_SZ, data: 'Kwanteks', iso: true}
 - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\OEMInformation', value: 'SupportURL', type: REG_SZ, data: 'https://discord.gg/kwanteks', iso: true}

  # Set Registered Owner/Organization (shows in About Windows)
 - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion', value: 'RegisteredOwner', type: REG_SZ, data: 'SynergyOS', iso: true}
 - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion', value: 'RegisteredOrganization', type: REG_SZ, data: 'Kwanteks', iso: true}

# Disable UAC
 - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', value: 'EnableLUA', type:  REG_DWORD, data: '0', iso: true, option: "disable-uac"}
 - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', value: 'PromptOnSecureDesktop', type:  REG_DWORD, data: '0', iso: true, option: "disable-uac"}
 - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', value: 'ConsentPromptBehaviorAdmin', type:  REG_DWORD, data: '0', iso: true, option: "disable-uac"}
 - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', value: 'ValidateAdminCodeSignatures', type:  REG_DWORD, data: '0', iso: true, option: "disable-uac"}

 - !writeStatus {status: "Installing Software"}
 - !task: {path: 'Tasks\software.yml'}

 # Registry Tweaks
 - !writeStatus {status: "Disabling Windows Updates"}
 - !task {path: 'Tasks\updates\update.yml'}
 - !task {path: 'Tasks\updates\driver.yml'}

 - !writeStatus {status: "Removing AppX Packages"}
 - !task {path: 'Tasks\package\appx.yml'}
 - !task {path: 'Tasks\package\components.yml'}

 - !writeStatus {status: "Configuring Privacy"}
 - !task {path: 'Tasks\registry\privacy.yml'}

 - !writeStatus {status: 'Configuring Settings'}
 - !task {path: 'Tasks\registry\settings.yml'}

  # macOS look - overrides the dark mode / left taskbar defaults set in settings.yml,
  # so these have to stay after that task. Cursors are handled in Tasks\software.yml.
 - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize', value: 'AppsUseLightTheme', type: REG_DWORD, data: '1', option: 'macos-look'}
 - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize', value: 'SystemUsesLightTheme', type: REG_DWORD, data: '1', option: 'macos-look'}
 - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize', value: 'EnableTransparency', type: REG_DWORD, data: '1', option: 'macos-look'}
 - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'TaskbarAl', type: REG_DWORD, data: '1', option: 'macos-look'}

 - !writeStatus {status: "Disabling Services"}
 - !task {path: 'Tasks\services.yml'}

 - !writeStatus {status: "Applying Wallpaper"}
 - !powerShell: {command: '.\wallpaper.ps1 -Mode Desktop -ImagePath $env:systemroot\Web\Wallpaper\sos.png', exeDir: true, runas: currentUserElevated}
 - !powerShell: {command: '.\wallpaper.ps1 -Mode LockScreen -ImagePath $env:systemroot\Web\Wallpaper\sos.png', exeDir: true, runas: currentUserElevated}


 - !writeStatus {status: "Optimizing PowerShell"}
 - !run:
    exeDir: true
    exe: "powershell"
    args: '-NoP -ExecutionPolicy Bypass -File ngen.ps1'
    weight: 50

 - !writeStatus {status: "Finalizing"}
 - !cmd: {command: '"startmen.cmd"', runas: trustedInstaller, exeDir: true, wait: true}
 - !powerShell:
    command: |
      $explorerProcess = Get-Process -Name explorer -ErrorAction SilentlyContinue
      if ($explorerProcess) {
        Stop-Process -Name explorer -Force
      }
      Start-Process explorer
    runas: currentUserElevated 
 - !cmd: {command: '"final.bat"', exeDir: true, runas: trustedInstaller, wait: true}
 - !cmd: {command: '"updhealth.bat"', exeDir: true, runas: trustedInstaller, wait: true}
 - !powerShell: {command: '.\cleanup.ps1', exeDir: true, runas: trustedInstaller, wait: true}

 - !writeStatus: {status: 'Backing up Services'}
 - !powerShell:
    exeDir: true
    wait: true
    command: |
      $path = Join-Path ([Environment]::GetFolderPath('Windows')) "ServicesBackup\SynergyServices.reg"
      
      if (-not (Test-Path -Path $path -PathType Leaf)) {
          .\backup.ps1 -FilePath $path
      }